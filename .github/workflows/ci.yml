name: CI

# Runs on every pull request that targets master, and on demand from the Actions tab.
# master itself is only written to through pull requests, so this is the gate.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Development happens on Windows; CI runs Linux to keep the cross-platform
        # constraint honest. Add more versions here as support widens.
        python-version: ["3.11"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        # Hard gate: every source file must parse.
        run: python -m compileall -q main.py Ammeters src examples scripts

      - name: Import check
        # Hard gate: imports also execute module level code, which is what catches the
        # class of bug compileall cannot (ISS-05 was a NameError in an annotation). This
        # was reported without blocking while ISS-05 was still open on master; that fix
        # has landed, so the step now fails the build.
        run: python scripts/ci_import_check.py

      - name: Run tests with coverage
        # Hard gate, and the one that checks behaviour rather than syntax.
        # Coverage is measured over `src/` - the framework being assessed.
        # `Ammeters/` is the supplied emulator stand-in for hardware: its
        # measurements are random by design and it is exercised by running
        # `main.py`, not by unit tests, so counting it here would report a
        # number about untested emulators rather than about the framework.
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=85
